{% set name = "robust-laplacian" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/robust_laplacian-{{ version }}.tar.gz
    sha256: 1db9eeb1a7aa340c3da902b125d2f58c7138feda206a72c2402dd25e702290d2

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - scikit-build-core                      # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake <4
    - make  # [unix]
  host:
    - pip
    - python
    - scikit-build-core
  run:
    - python
    - numpy
    - scipy

test:
  imports:
    - robust_laplacian
  commands:
    - python -c "import numpy as np; import robust_laplacian as rl; verts = np.array([[0., 0., 0.], [1., 0., 0.], [0., 1., 0.], [0., 0., 1.]], dtype=np.float64); faces = np.array([[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]], dtype=np.int64); L, M = rl.mesh_laplacian(verts, faces); assert L.shape == (4, 4); assert M.shape == (4, 4); assert L.nnz > 0; assert M.nnz == 4; assert np.allclose((L - L.T).data, 0.0, atol=1e-8); assert np.all(M.diagonal() > 0.0)"
    - pip check
  requires:
    - pip
    - python

about:
  home: https://github.com/nmwsharp/robust-laplacians-py
  summary: Build high-quality Laplace matrices on meshes and point clouds in Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jeongseok-meta
